[package]
name = "vmharness"
version = "0.1.0"
edition = "2021"

[dependencies]
cosmwasm-vm = "=1.5.11"
cosmwasm-std = { version = "=1.5.11", features = ["iterator", "staking"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64ct = "=1.6.0" # pin: newer base64ct requires edition2024 (cargo 1.81)

[profile.dev]
opt-level = 1
