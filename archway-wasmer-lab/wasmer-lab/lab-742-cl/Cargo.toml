[package]
name = "lab-742-cl"
version = "0.1.0"
edition = "2021"

[features]
default = ["engine-cranelift", "new-wasmer"]
engine-singlepass = []
engine-cranelift = []
old-wasmer = []
new-wasmer = []

[dependencies]
wasmer = { version = "=7.4.2", default-features = false, features = ["sys", "cranelift", "wat"] }
libc = "0.2"

[profile.release]
opt-level = 2
