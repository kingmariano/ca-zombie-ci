[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# Verified GRXSwap TokenPair (extracted verbatim from the verified GRXSwapFactoryV2
# source on grxscan.io). Compiled with the factory's settings: solc 0.5.16, optimizer off.
[profile.pair]
src = "pair"
test = "no-tests"
script = "no-scripts"
out = "out-pair"
libs = ["lib"]
solc = "0.5.16"
optimizer = false
evm_version = "istanbul"

# Full verified factory file (interfaces + SafeMath + GRC20 + TokenPair + GRXSwapFactoryV2).
[profile.factory]
src = "factory"
test = "no-tests"
script = "no-scripts"
out = "out-factory"
libs = ["lib"]
solc = "0.5.16"
optimizer = false
evm_version = "istanbul"
