[package]
name = "jet-poc-svm"
version = "0.1.0"
edition = "2021"
description = "Jet Protocol v1 (Solana) frozen-oracle PoC on cloned mainnet state (LiteSVM). Read-only test: no mainnet tx is ever sent."
publish = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
litesvm = "0.18.0"
solana-account = "4.3"
solana-address = { version = "2.7", features = ["decode", "curve25519"] }
solana-clock = "3.2"
solana-instruction = "3.5"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-transaction = "4.1"

[profile.release]
opt-level = 1
debug = false
